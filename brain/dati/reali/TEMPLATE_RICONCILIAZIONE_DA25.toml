# TEMPLATE DI RICONCILIAZIONE ESTRATTO CONTO PER GUARDIAN G0 (DA-25)
# Da compilare con i dati dell'estratto conto reale o demo di Gioele Melis.
# Governance Epistemica: Ogni campo numerico rappresenta una MISURA della piattaforma broker/prop firm.

[conto]
prop_firm_o_broker = "FTMO"               # FTMO | Altro Broker
prodotto = "2-Step"                       # 2-Step | 1-Step | Instant
tipo_conto = "Standard"                   # Standard | Swing
piattaforma = "MetaTrader 5"              # MT4 | MT5 | cTrader | DXtrade
