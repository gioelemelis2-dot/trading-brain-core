valuta_conto = "EUR"                      # EUR | USD | GBP
capitale_iniziale = "100000.00"           # Dimensione iniziale della challenge/conto
data_inizio_challenge_utc = "2026-11-01T00:00:00Z"

[saldo_e_orari]
# FTMO calcola il max daily loss dal saldo alle 00:00 CE(S)T
data_rilevazione_utc = "2026-11-12T22:00:00Z"
