[[posizioni_aperte]]
id_ticket = "1019283"
simbolo = "EURUSD"
direzione = "LONG"                        # LONG | SHORT
quantita_lotti = "1.00"
prezzo_apertura = "1.08500"
orario_apertura_utc = "2026-11-12T14:30:00Z"
stop_loss = "1.08100"
