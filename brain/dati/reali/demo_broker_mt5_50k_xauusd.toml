# SCHEDA OPERATIVA GATE 1 — CONTO DEMO BROKER ECN · METATRADER 5 · 50.000 USD · XAU/USD
# Incubazione pre-prop firm: conto DEMO, nessun denaro reale.
#
# Il broker non impone limiti di perdita. Le regole di protezione 5% giornaliero / 10% totale sono SIMULATE
# INTERNAMENTE dal G0 con lo schema del prodotto "ftmo_2step":
#   limite giornaliero = saldo alle 00:00 CE(S)T − 5% del capitale iniziale (2.500 USD);
#   limite totale statico = capitale iniziale − 10% (5.000 USD).
# La scheda le mostra sotto «REGOLE DELLA PROP FIRM» con la fonte prop_firm_ftmo.toml: qui sono regole INTERNE.
#
# Parametri iniziali pre-operativi: nessuna posizione aperta, nessun trade previsto. Da riconciliare con la
# piattaforma (DA-25) prima di usare i numeri per decidere.

[conto]
